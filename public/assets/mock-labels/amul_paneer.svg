<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="amulBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5394" />
      <stop offset="50%" stop-color="#1155cc" />
      <stop offset="100%" stop-color="#1c4587" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Pouch Background -->
  <rect width="600" height="450" rx="16" fill="url(#amulBg)"/>
  
  <!-- Header / Brand Header -->
  <rect x="20" y="20" width="560" height="80" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="40" y="65" font-family="Arial, sans-serif" font-weight="900" font-size="38" fill="#d32f2f" letter-spacing="2">Amul</text>
  <text x="180" y="52" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#0b5394">FRESH PANEER</text>
  <text x="180" y="74" font-family="Arial, sans-serif" font-size="12" fill="#555555">High Protein Cottage Cheese • Rich &amp; Soft</text>
  <circle cx="530" cy="60" r="18" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="530" cy="60" r="8" fill="#2e7d32"/>

  <!-- Main Body Content Grid -->
  <rect x="20" y="115" width="340" height="230" rx="10" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
  
  <text x="35" y="145" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#111827">STATUTORY DECLARATIONS (PCR 2011)</text>
  <line x1="35" y1="152" x2="345" y2="152" stroke="#e5e7eb" stroke-width="1.5"/>

  <text x="35" y="175" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#374151">Net Quantity:</text>
  <text x="155" y="175" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#111827">200 g</text>

  <text x="35" y="200" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#374151">Max Retail Price:</text>
  <text x="155" y="200" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#b91c1c">₹ 95.00 <tspan font-size="10" fill="#6b7280">(Incl. of all taxes)</tspan></text>

  <text x="35" y="222" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#374151">Unit Sale Price:</text>
  <text x="155" y="222" font-family="Arial, sans-serif" font-size="11" fill="#111827">₹ 0.48 / g</text>

  <text x="35" y="244" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#374151">Country of Origin:</text>
  <text x="155" y="244" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#15803d">INDIA</text>

  <text x="35" y="266" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#374151">FSSAI Lic No:</text>
  <text x="155" y="266" font-family="monospace" font-size="11" fill="#111827">10012021000071</text>

  <text x="35" y="288" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#374151">Use-By Date:</text>
  <text x="155" y="288" font-family="Arial, sans-serif" font-size="10" fill="#4b5563">Use within 30 days from packaging</text>

  <text x="35" y="310" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#374151">Batch No:</text>
  <text x="155" y="310" font-family="monospace" font-weight="bold" font-size="10" fill="#1f2937">AM-PN-2026-44</text>

  <text x="35" y="330" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#374151">Storage:</text>
  <text x="155" y="330" font-family="Arial, sans-serif" font-size="9" fill="#4b5563">Keep refrigerated below 4°C</text>

  <!-- Right Side: Manufacturer & Barcode Panel -->
  <rect x="375" y="115" width="205" height="230" rx="10" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
  
  <text x="388" y="140" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111827">MANUFACTURED BY:</text>
  <text x="388" y="158" font-family="Arial, sans-serif" font-size="9.5" fill="#374151" width="180">
    <tspan x="388" dy="0">Gujarat Cooperative Milk</tspan>
    <tspan x="388" dy="12">Marketing Federation Ltd.</tspan>
    <tspan x="388" dy="12">(GCMMF), Amul Dairy Road,</tspan>
    <tspan x="388" dy="12">Anand - 388001, Gujarat, India</tspan>
  </text>

  <line x1="388" y1="210" x2="565" y2="210" stroke="#e5e7eb" stroke-width="1"/>

  <text x="388" y="228" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#111827">CONSUMER CARE:</text>
  <text x="388" y="244" font-family="Arial, sans-serif" font-size="9" fill="#2563eb">Toll Free: 1800-258-3333</text>
  <text x="388" y="258" font-family="Arial, sans-serif" font-size="9" fill="#2563eb">customercare@amul.coop</text>

  <!-- Barcode Simulation -->
  <g transform="translate(390, 275)">
    <rect x="0" y="0" width="175" height="48" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="10" y1="5" x2="10" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="16" y1="5" x2="16" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="24" y1="5" x2="24" y2="35" stroke="#000" stroke-width="1"/>
    <line x1="30" y1="5" x2="30" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="38" y1="5" x2="38" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="45" y1="5" x2="45" y2="35" stroke="#000" stroke-width="5"/>
    <line x1="56" y1="5" x2="56" y2="35" stroke="#000" stroke-width="1"/>
    <line x1="62" y1="5" x2="62" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="72" y1="5" x2="72" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="80" y1="5" x2="80" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="90" y1="5" x2="90" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="98" y1="5" x2="98" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="108" y1="5" x2="108" y2="35" stroke="#000" stroke-width="1"/>
    <line x1="115" y1="5" x2="115" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="125" y1="5" x2="125" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="135" y1="5" x2="135" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="145" y1="5" x2="145" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="155" y1="5" x2="155" y2="35" stroke="#000" stroke-width="2"/>
    <text x="88" y="44" font-family="monospace" font-size="8" text-anchor="middle" fill="#333">8 901262 010214</text>
  </g>

  <!-- Footer Legal Banner -->
  <rect x="20" y="360" width="560" height="70" rx="8" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
  <text x="35" y="385" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">GOVT. LEGAL METROLOGY PACKAGED COMMODITIES COMPLIANCE SEAL</text>
  <text x="35" y="405" font-family="Arial, sans-serif" font-size="9" fill="#475569">Certified compliant with Rule 6(1) Declarations &amp; Schedule II Minimum Height (2.8mm Net Qty, 2.2mm MRP).</text>
  <rect x="475" y="372" width="90" height="46" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="520" y="392" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#065f46">PASS</text>
  <text x="520" y="407" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#047857">100/100 SCORE</text>
</svg>
