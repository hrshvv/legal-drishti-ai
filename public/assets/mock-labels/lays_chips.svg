  <text x="35" y="405" font-family="Arial, sans-serif" font-size="9" fill="#7f1d1d">Missing Country of Origin (Rule 6(1)(aa)) &amp; Unit Sale Price (Rule 6(1)(ab)) violations detected.</text>
  <rect x="465" y="372" width="105" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="517" y="392" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#b91c1c">FAILED</text>
  <text x="517" y="407" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#dc2626">SEC 18 NOTICE</text>
