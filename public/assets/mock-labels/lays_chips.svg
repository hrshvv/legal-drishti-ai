  <text x="140" y="52" font-family="Arial, sans-serif" font-weight="bold" font-size="20" fill="#1e1e24">CLASSIC SALTED POTATO CHIPS</text>
  <text x="140" y="74" font-family="Arial, sans-serif" font-size="12" fill="#666666">Crispy Golden Potatoes • Trans-fat Free</text>
  <circle cx="530" cy="60" r="18" fill="none" stroke="#2e7d32" stroke-width="2"/>
