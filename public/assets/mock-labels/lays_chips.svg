  <g transform="translate(390, 275)">
    <rect x="0" y="0" width="175" height="48" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="10" y1="5" x2="10" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="22" y1="5" x2="22" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="35" y1="5" x2="35" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="50" y1="5" x2="50" y2="35" stroke="#000" stroke-width="1"/>
    <line x1="62" y1="5" x2="62" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="78" y1="5" x2="78" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="90" y1="5" x2="90" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="106" y1="5" x2="106" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="120" y1="5" x2="120" y2="35" stroke="#000" stroke-width="3"/>
