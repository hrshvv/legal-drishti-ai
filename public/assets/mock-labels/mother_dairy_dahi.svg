<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="mdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#mdBg)"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="560" height="80" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="80" cy="60" r="26" fill="#0284c7"/>
  <text x="80" y="65" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#ffffff" text-anchor="middle">MOTHER</text>
  <text x="80" y="76" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#ffffff" text-anchor="middle">DAIRY</text>
  <text x="140" y="52" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#0369a1">CLASSIC DAHI</text>
  <text x="140" y="74" font-family="Arial, sans-serif" font-size="12" fill="#555555">Pasteurized Toned Milk Curd • Thick &amp; Delicious</text>
  <circle cx="530" cy="60" r="18" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="530" cy="60" r="8" fill="#2e7d32"/>

  <!-- Left Declarations Panel -->
  <rect x="20" y="115" width="340" height="230" rx="10" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
  <text x="35" y="145" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#111827">STATUTORY DECLARATIONS (PCR 2011)</text>
  <line x1="35" y1="152" x2="345" y2="152" stroke="#e5e7eb" stroke-width="1.5"/>

  <text x="35" y="175" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#374151">Net Quantity:</text>
  <text x="155" y="175" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#111827">400 g</text>

  <text x="35" y="200" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#374151">Max Retail Price:</text>
  <text x="155" y="200" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#b91c1c">₹ 40.00 <tspan font-size="10" fill="#6b7280">(Incl. of all taxes)</tspan></text>

  <text x="35" y="222" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#374151">Unit Sale Price:</text>
  <text x="155" y="222" font-family="Arial, sans-serif" font-size="11" fill="#111827">₹ 0.10 / g</text>

  <text x="35" y="244" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#374151">Country of Origin:</text>
  <text x="155" y="244" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#15803d">INDIA</text>

  <text x="35" y="266" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#374151">FSSAI Lic No:</text>
  <text x="155" y="266" font-family="monospace" font-size="11" fill="#111827">10014011001895</text>

  <!-- Sub-minimum packing date warning -->
  <rect x="30" y="278" width="320" height="24" rx="4" fill="#fef3c7" stroke="#d97706" stroke-dasharray="2,2"/>
  <text x="35" y="294" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#92400e">Packing Date: Pkd 08/26 (0.8mm font - Sub-min Rule 6(1)(d))</text>

  <text x="35" y="318" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#374151">Batch No:</text>
  <text x="155" y="318" font-family="monospace" font-weight="bold" font-size="10" fill="#1f2937">MD-DH-77</text>

  <text x="35" y="336" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#374151">Use-By:</text>
  <text x="155" y="336" font-family="Arial, sans-serif" font-size="9" fill="#4b5563">15 days from packing (Keep cold)</text>

  <!-- Right Panel -->
  <rect x="375" y="115" width="205" height="230" rx="10" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
  <text x="388" y="140" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111827">MFD &amp; PACKED BY:</text>
  <text x="388" y="158" font-family="Arial, sans-serif" font-size="9.5" fill="#374151">
    <tspan x="388" dy="0">Mother Dairy Fruit &amp;</tspan>
    <tspan x="388" dy="12">Vegetable Pvt. Ltd.</tspan>
    <tspan x="388" dy="12">Patparganj, Delhi - 110092</tspan>
    <tspan x="388" dy="12">Delhi, India</tspan>
  </text>
  <line x1="388" y1="210" x2="565" y2="210" stroke="#e5e7eb" stroke-width="1"/>
  <text x="388" y="228" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#111827">CONSUMER HELPLINE:</text>
  <text x="388" y="244" font-family="Arial, sans-serif" font-size="9" fill="#2563eb">1800-180-1018</text>
  <text x="388" y="258" font-family="Arial, sans-serif" font-size="9" fill="#2563eb">consumer.services@motherdairy.com</text>

  <g transform="translate(390, 275)">
    <rect x="0" y="0" width="175" height="48" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="10" y1="5" x2="10" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="20" y1="5" x2="20" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="35" y1="5" x2="35" y2="35" stroke="#000" stroke-width="1"/>
    <line x1="48" y1="5" x2="48" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="60" y1="5" x2="60" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="72" y1="5" x2="72" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="88" y1="5" x2="88" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="102" y1="5" x2="102" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="120" y1="5" x2="120" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="135" y1="5" x2="135" y2="35" stroke="#000" stroke-width="3"/>
    <text x="88" y="44" font-family="monospace" font-size="8" text-anchor="middle" fill="#333">8 901648 003301</text>
  </g>

  <!-- Footer Legal Banner -->
  <rect x="20" y="360" width="560" height="70" rx="8" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
  <text x="35" y="385" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#b45309">PARTIAL COMPLIANCE (78/100 SCORE) — STATUTORY RECTIFICATION NOTICE</text>
  <text x="35" y="405" font-family="Arial, sans-serif" font-size="9" fill="#475569">Packing date font height measured 0.8mm against statutory minimum 1.0mm (Rule 6(1)(d)).</text>
  <rect x="475" y="372" width="90" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="392" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#b45309">WARNING</text>
  <text x="520" y="407" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#92400e">RULE 6(1)(d)</text>
</svg>
