<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="haldiramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="600" height="450" rx="16" fill="url(#haldiramBg)"/>
  
  <!-- Header -->
  <rect x="20" y="20" width="560" height="80" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="35" y="32" width="130" height="56" rx="6" fill="#dc2626"/>
  <text x="100" y="68" font-family="Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">Haldiram's</text>
  <text x="180" y="54" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#78350f">ALOO BHUJIA</text>
  <text x="180" y="74" font-family="Arial, sans-serif" font-size="12" fill="#555555">Crispy Spiced Potato &amp; Gram Flour Noodles</text>
  <circle cx="530" cy="60" r="18" fill="none" stroke="#2e7d32" stroke-width="2"/>
  <circle cx="530" cy="60" r="8" fill="#2e7d32"/>

  <!-- Left Declarations Panel -->
  <rect x="20" y="115" width="340" height="230" rx="10" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
  <text x="35" y="145" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#111827">STATUTORY DECLARATIONS (PCR 2011)</text>
  <line x1="35" y1="152" x2="345" y2="152" stroke="#e5e7eb" stroke-width="1.5"/>

  <text x="35" y="175" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#374151">Net Weight:</text>
  <text x="155" y="175" font-family="Arial, sans-serif" font-weight="900" font-size="15" fill="#111827">150 g</text>

  <text x="35" y="200" font-family="Arial, sans-serif" font-weight="bold" font-size="12" fill="#374151">Max Retail Price:</text>
  <text x="155" y="200" font-family="Arial, sans-serif" font-weight="bold" font-size="13" fill="#b91c1c">₹ 42.00 <tspan font-size="10" fill="#6b7280">(Incl. of all taxes)</tspan></text>

  <text x="35" y="222" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#374151">Unit Sale Price:</text>
  <text x="155" y="222" font-family="Arial, sans-serif" font-size="11" fill="#111827">₹ 0.28 / g</text>

  <text x="35" y="244" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#374151">Country of Origin:</text>
  <text x="155" y="244" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#15803d">INDIA</text>

  <text x="35" y="266" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#374151">FSSAI Lic No:</text>
  <text x="155" y="266" font-family="monospace" font-size="11" fill="#111827">10012022000388</text>

  <text x="35" y="288" font-family="Arial, sans-serif" font-weight="bold" font-size="10" fill="#374151">Best Before:</text>
  <text x="155" y="288" font-family="Arial, sans-serif" font-size="10" fill="#4b5563">6 Months from packaging date</text>

  <text x="35" y="310" font-family="Arial, sans-serif" font-weight="bold" font-size="9" fill="#374151">Batch No:</text>
  <text x="155" y="310" font-family="monospace" font-weight="bold" font-size="10" fill="#1f2937">HD-AB-402</text>

  <!-- Right Panel with Highlighted Font Infraction -->
  <rect x="375" y="115" width="205" height="230" rx="10" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
  <text x="388" y="140" font-family="Arial, sans-serif" font-weight="bold" font-size="11" fill="#111827">MFD &amp; PACKED BY:</text>
  <text x="388" y="158" font-family="Arial, sans-serif" font-size="9.5" fill="#374151">
    <tspan x="388" dy="0">Haldiram Foods Intl. Pvt. Ltd.</tspan>
    <tspan x="388" dy="12">20 Km Stone, Vill-Khedi,</tspan>
    <tspan x="388" dy="12">Amravati Road, Nagpur - 440023</tspan>
    <tspan x="388" dy="12">Maharashtra, India</tspan>
  </text>
  
  <line x1="388" y1="210" x2="565" y2="210" stroke="#e5e7eb" stroke-width="1"/>
  
  <!-- Tiny Customer Care Text in Violation Box -->
  <rect x="384" y="218" width="186" height="48" rx="4" fill="#fef3c7" stroke="#d97706" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="388" y="232" font-family="Arial, sans-serif" font-weight="bold" font-size="8" fill="#b45309">CUSTOMER GRIEVANCE (0.75mm FONT!):</text>
  <text x="388" y="244" font-family="Arial, sans-serif" font-size="7" fill="#451a03">customercare@haldirams.com / +91-712-2779451</text>
  <text x="388" y="256" font-family="Arial, sans-serif" font-size="6.5" fill="#9a3412">⚠ Non-compliant: Min 1.0mm required (Sched. II)</text>

  <g transform="translate(390, 275)">
    <rect x="0" y="0" width="175" height="48" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="10" y1="5" x2="10" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="18" y1="5" x2="18" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="28" y1="5" x2="28" y2="35" stroke="#000" stroke-width="1"/>
    <line x1="40" y1="5" x2="40" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="55" y1="5" x2="55" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="68" y1="5" x2="68" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="80" y1="5" x2="80" y2="35" stroke="#000" stroke-width="2"/>
    <line x1="95" y1="5" x2="95" y2="35" stroke="#000" stroke-width="4"/>
    <line x1="110" y1="5" x2="110" y2="35" stroke="#000" stroke-width="1"/>
    <line x1="125" y1="5" x2="125" y2="35" stroke="#000" stroke-width="3"/>
    <line x1="140" y1="5" x2="140" y2="35" stroke="#000" stroke-width="2"/>
    <text x="88" y="44" font-family="monospace" font-size="8" text-anchor="middle" fill="#333">8 904063 205012</text>
  </g>

  <!-- Footer Legal Banner -->
  <rect x="20" y="360" width="560" height="70" rx="8" fill="#ffffff" fill-opacity="0.95" filter="url(#shadow)"/>
  <text x="35" y="385" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#b45309">PARTIAL COMPLIANCE (75/100 SCORE) — STATUTORY WARNING ISSUED</text>
  <text x="35" y="405" font-family="Arial, sans-serif" font-size="9" fill="#475569">Customer Care font height measured 0.75mm against statutory minimum 1.0mm (Schedule II Rule 7(1)).</text>
  <rect x="475" y="372" width="90" height="46" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="520" y="392" font-family="Arial, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#b45309">WARNING</text>
  <text x="520" y="407" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#92400e">RULE 7(1) FAIL</text>
</svg>
