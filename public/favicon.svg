<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#2563eb" />
      <stop offset="50%" stopColor="#1d4ed8" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="50%" stopColor="#818cf8" />
      <stop offset="100%" stopColor="#38bdf8" />
    </linearGradient>
    <linearGradient id="irisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Shield Body -->
  <path d="M32 4L10 12V28C10 43 19.5 54.5 32 60C44.5 54.5 54 43 54 28V12L32 4Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-linejoin="round" />
  
  <!-- Outer Eye Shape (Drishti / Vision) -->
  <path d="M18 31C22 23 27 19 32 19C37 19 42 23 46 31C42 39 37 43 32 43C27 43 22 39 18 31Z" fill="#0f172a" fill-opacity="0.5" stroke="url(#glowGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Iris Circle -->
  <circle cx="32" cy="31" r="7" fill="url(#irisGrad)" filter="url(#glow)" />
  
  <!-- Inner Pupil / Center Core -->
  <circle cx="32" cy="31" r="3" fill="#ffffff" />
  
  <!-- Top Center Legal Balance / Crown Notch -->
  <path d="M32 9V14M29 11.5H35" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- AI Scanning Horizontal Target Lines -->
  <path d="M14 31H17M47 31H50" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
</svg>